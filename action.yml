name: "CodSpeed Performance Analysis"
description: "Continuous benchmarking and performance checks"
branding:
  color: orange
  icon: activity
author: "Arthur Pastel"
inputs:
  run:
    description: "The command to run the benchmarks"
    required: false
  mode:
    description: |
      The mode(s) to run the benchmarks in. Accepts a single value or a comma-separated list (e.g., "simulation,walltime").
      The following modes are available:
      - `simulation`: Run the benchmarks with CPU simulation measurements.
      - `walltime`: Run the benchmarks with walltime measurement.
      - `memory`: Run the benchmarks with allocation measurements.
      - `instrumentation`: (Deprecated) Legacy name for `simulation`. Please use `simulation` instead.

      We strongly recommend starting with the `simulation` mode.

      Using the `walltime` mode on traditional VMs/Hosted Runners might lead to inconsistent data. For the best results, we recommend using CodSpeed Hosted Macro Runners, which are fine-tuned for performance measurement consistency.
      Check out the [Walltime Instrument Documentation](https://docs.codspeed.io/instruments/walltime/) for more details.
    required: true
  token:
    description: |
      CodSpeed upload token. Only required for private repositories.
    required: false
  working-directory:
    description: |
      The directory where the `run` command will be executed.
      Warning: if you use defaults.working-directory, you must still set this parameter.
    required: false
  upload-url:
    description: "The upload endpoint (for on-premise deployments)"
    required: false
  runner-version:
    description: "The version of the runner to use. Use 'latest' to automatically fetch the latest release version from GitHub, or specify a version like '3.5.0' or 'v3.5.0'."
    required: false
  instruments:
    description: |
      Comma separated list of instruments to enable. The following instruments are available:
      - `mongodb`: MongoDB instrumentation, requires the MongoDB instrument to be enabled for the organization in CodSpeed
    required: false
  mongo-uri-env-name:
    description: |
      The name of the environment variable containing the MongoDB URI. Requires the `mongodb` instrument to be activated in `instruments`.
      If the instrumentation is enabled and this value is not set, the user will need to dynamically provide the MongoDB URI to the CodSpeed runner.
    required: false
  cache-instruments:
    description: |
      Enable caching of instrument installations (like valgrind or perf) to speed up subsequent workflow runs. Set to 'false' to disable caching.
    required: false
    default: "true"
  instruments-cache-dir:
    description: |
      The directory to use for caching installations of instruments (like valgrind or perf). Defaults to `$HOME/.cache/codspeed-action`.
    required: false
    default: "~/.cache/codspeed-action"
  allow-empty:
    description: |
      Allow the action to complete successfully even if no benchmarks were found or run. Set to 'true' to enable this behavior.
    required: false
    default: "false"
  go-runner-version:
    description: "The version of the go-runner to use (e.g., 1.0.0, 1.0.0-beta.1). If not specified, the latest version will be installed"
    required: false
  config:
    description: "Path to a CodSpeed configuration file (codspeed.yml). If not specified, the runner will look for a codspeed.yml file in the repository root."
    required: false
  skip-hash-check-warning:
    description: "Suppress the warning emitted when hash verification is not available (e.g. when using 'latest', branch, or revision versions)."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Determine runner and kernel version
      id: versions
      shell: bash
      env:
        INPUT_RUNNER_VERSION: ${{ inputs.runner-version }}
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        RUNNER_VERSION="$INPUT_RUNNER_VERSION"
        if [ -z "$RUNNER_VERSION" ]; then
          RUNNER_VERSION=$(cat $GITHUB_ACTION_PATH/.codspeed-runner-version)
        fi
        # Strip 'v' prefix if present to normalize version format
        RUNNER_VERSION="${RUNNER_VERSION#v}"

        # Detect version type (priority: latest > version number > branch/rev prefixes)
        if [ "$RUNNER_VERSION" = "latest" ]; then
          VERSION_TYPE="latest"
        elif echo "$RUNNER_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
          VERSION_TYPE="release"
        elif echo "$RUNNER_VERSION" | grep -q '^branch:'; then
          VERSION_TYPE="branch"
          RUNNER_VERSION=$(echo "$RUNNER_VERSION" | sed 's/^branch://')
        elif echo "$RUNNER_VERSION" | grep -q '^rev:'; then
          VERSION_TYPE="rev"
          RUNNER_VERSION=$(echo "$RUNNER_VERSION" | sed 's/^rev://')
        else
          # Default to release version
          VERSION_TYPE="release"
        fi

        safe_runner_version=$(printf '%s' "$RUNNER_VERSION" | tr -d '\n\r')
        echo "runner-version=$safe_runner_version" >> "$GITHUB_OUTPUT"
        safe_version_type=$(printf '%s' "$VERSION_TYPE" | tr -d '\n\r')
        echo "version-type=$safe_version_type" >> "$GITHUB_OUTPUT"

        # Get kernel version for cache key
        KERNEL_VERSION=$(uname -r)
        safe_kernel_version=$(printf '%s' "$KERNEL_VERSION" | tr -d '\n\r')
        echo "kernel-version=$safe_kernel_version" >> "$GITHUB_OUTPUT"

        # Normalize mode for cache key (commas are not allowed in cache keys)
        MODE_CACHE_KEY=$(printf '%s' "$INPUT_MODE" | tr ',' '-' | tr -d '\n\r')
        echo "mode-cache-key=$MODE_CACHE_KEY" >> "$GITHUB_OUTPUT"
    - name: Cache CodSpeed instruments
      if: inputs.cache-instruments == 'true'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ inputs.instruments-cache-dir }}
        key: codspeed-instruments-${{ steps.versions.outputs.mode-cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.kernel-version }}-${{ steps.versions.outputs.runner-version }}
        restore-keys: |
          codspeed-instruments-${{ steps.versions.outputs.mode-cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.kernel-version }}-
    - name: Lookup installer hash
      id: installer-hash
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        RUNNER_VERSION: ${{ steps.versions.outputs.runner-version }}
      with:
        script: |
          const hashes = require(`${process.env.GITHUB_ACTION_PATH}/.codspeed-runner-installer-hashes.json`)
          const version = process.env.RUNNER_VERSION
          core.setOutput('hash', hashes[version] || '')
    - name: Install CodSpeed runner
      shell: bash
      env:
        RUNNER_VERSION: ${{ steps.versions.outputs.runner-version }}
        VERSION_TYPE: ${{ steps.versions.outputs.version-type }}
        SKIP_HASH_CHECK_WARNING: ${{ inputs.skip-hash-check-warning }}
        EXPECTED_HASH: ${{ steps.installer-hash.outputs.hash }}
      run: |
        if [ "$VERSION_TYPE" = "latest" ]; then
          if [ "$SKIP_HASH_CHECK_WARNING" != "true" ]; then
            echo "::warning::Hash verification is not available when using 'latest' version. Consider pinning a specific version for supply chain security."
          fi
          INSTALLER_TMP=$(mktemp)
          trap "rm -f $INSTALLER_TMP" EXIT
          curl -fsSL https://codspeed.io/install.sh -o "$INSTALLER_TMP"
          bash "$INSTALLER_TMP" --quiet
        elif [ "$VERSION_TYPE" = "branch" ]; then
          # Install from specific branch using cargo
          if [ "$SKIP_HASH_CHECK_WARNING" != "true" ]; then
            echo "::warning::Hash verification is not available when installing from a branch."
          fi
          source $HOME/.cargo/env
          cargo install --locked --git https://github.com/CodSpeedHQ/codspeed --branch "$RUNNER_VERSION" codspeed-runner
        elif [ "$VERSION_TYPE" = "rev" ]; then
          # Install from specific commit/rev using cargo
          if [ "$SKIP_HASH_CHECK_WARNING" != "true" ]; then
            echo "::warning::Hash verification is not available when installing from a revision."
          fi
          source $HOME/.cargo/env
          cargo install --locked --git https://github.com/CodSpeedHQ/codspeed --rev "$RUNNER_VERSION" codspeed-runner
        else
          # Release version - download to temp file and verify hash
          INSTALLER_URL="https://codspeed.io/v$RUNNER_VERSION/install.sh"
          INSTALLER_TMP=$(mktemp)
          trap "rm -f $INSTALLER_TMP" EXIT

          CURL_ERR=$(mktemp)
          if ! HTTP_CODE=$(curl -sSL -o "$INSTALLER_TMP" -w "%{http_code}" "$INSTALLER_URL" 2>"$CURL_ERR"); then
            echo "::error title=Failed to install CodSpeed CLI::Installation of CodSpeed CLI with version $RUNNER_VERSION failed.%0AReason: $(cat "$CURL_ERR")"
            exit 1
          fi
          if [ "$HTTP_CODE" -ge 400 ]; then
            error_body=$(cat "$INSTALLER_TMP")
            echo "::error title=Failed to install CodSpeed CLI::Installation of CodSpeed CLI with version $RUNNER_VERSION failed.%0AReason: HTTP $HTTP_CODE - ${error_body:-no response body}"
            exit 1
          fi

          if [ -z "$EXPECTED_HASH" ]; then
            echo "::error::No pinned hash found for installer version $RUNNER_VERSION. Update .codspeed-runner-installer-hashes.json."
            exit 1
          fi

          ACTUAL_HASH=$(sha256sum "$INSTALLER_TMP" | awk '{print $1}')
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Installer hash mismatch for version $RUNNER_VERSION. Expected: $EXPECTED_HASH, Got: $ACTUAL_HASH"
            exit 1
          fi
          echo "Installer hash verified for version $RUNNER_VERSION"

          bash "$INSTALLER_TMP" --quiet
        fi
    - name: Run the benchmarks
      shell: bash
      env:
        GH_MATRIX: "${{ toJson(matrix) }}"
        GH_STRATEGY: "${{ toJson(strategy) }}"
        # This is needed to properly handle quotes and multiline commands in the 'run' input properly, rather than doing `RUN_INPUT_RUN=${{ inputs.run }}` in the script
        CODSPEED_INPUT_RUN: ${{ inputs.run }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_UPLOAD_URL: ${{ inputs.upload-url }}
        INPUT_INSTRUMENTS: ${{ inputs.instruments }}
        INPUT_MONGO_URI_ENV_NAME: ${{ inputs.mongo-uri-env-name }}
        INPUT_CACHE_INSTRUMENTS: ${{ inputs.cache-instruments }}
        INPUT_INSTRUMENTS_CACHE_DIR: ${{ inputs.instruments-cache-dir }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        INPUT_GO_RUNNER_VERSION: ${{ inputs.go-runner-version }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        # Validate required inputs
        # (custom message for smoother v4 migration)
        if [ -z "$INPUT_MODE" ]; then
          echo "::error title=Missing required input 'mode'::The 'mode' input is required as of CodSpeed Action v4. Please explicitly set 'mode' to 'simulation' or 'walltime'. Before, this variable was automatically set to instrumentation on every runner except for CodSpeed macro runners where it was set to walltime by default. See https://codspeed.io/docs/instruments for details."
          exit 1
        fi

        # Build the runner arguments array
        RUNNER_ARGS=()
        if [ -n "$INPUT_TOKEN" ]; then
          RUNNER_ARGS+=(--token "$INPUT_TOKEN")
        fi
        if [ -n "$INPUT_WORKING_DIRECTORY" ]; then
          RUNNER_ARGS+=(--working-directory="$INPUT_WORKING_DIRECTORY")
        fi
        if [ -n "$INPUT_UPLOAD_URL" ]; then
          RUNNER_ARGS+=(--upload-url="$INPUT_UPLOAD_URL")
        fi
        if [ -n "$INPUT_MODE" ]; then
          RUNNER_ARGS+=(--mode="$INPUT_MODE")
        fi
        if [ -n "$INPUT_INSTRUMENTS" ]; then
          RUNNER_ARGS+=(--instruments="$INPUT_INSTRUMENTS")
        fi
        if [ -n "$INPUT_MONGO_URI_ENV_NAME" ]; then
          RUNNER_ARGS+=(--mongo-uri-env-name="$INPUT_MONGO_URI_ENV_NAME")
        fi
        if [ "$INPUT_CACHE_INSTRUMENTS" = "true" ] && [ -n "$INPUT_INSTRUMENTS_CACHE_DIR" ]; then
          RUNNER_ARGS+=(--setup-cache-dir="$INPUT_INSTRUMENTS_CACHE_DIR")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          RUNNER_ARGS+=(--allow-empty)
        fi
        if [ -n "$INPUT_GO_RUNNER_VERSION" ]; then
          RUNNER_ARGS+=(--go-runner-version="$INPUT_GO_RUNNER_VERSION")
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          RUNNER_ARGS+=(--config="$INPUT_CONFIG")
        fi

        if [ -n "$CODSPEED_INPUT_RUN" ]; then
          RUNNER_ARGS+=(-- "$CODSPEED_INPUT_RUN")
        fi

        # Run the benchmarks
        codspeed run "${RUNNER_ARGS[@]}"
