name: Test with latest runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test using 'latest' runner version - this skips hash verification
      # and downloads the latest release from codspeed.io
      - id: action
        uses: .
        with:
          mode: walltime
          allow-empty: "true"
          runner-version: "latest"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran with latest runner version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with latest runner version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
