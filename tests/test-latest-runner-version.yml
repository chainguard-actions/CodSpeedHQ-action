name: Test latest runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: simulation
          runner-version: latest
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert codspeed runner was installed with latest version
        run: |
          echo "Checking that codspeed binary was installed (latest version)..."
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found in PATH"
            exit 1
          fi
          echo "PASS: codspeed binary is installed (latest version)"
