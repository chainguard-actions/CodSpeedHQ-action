name: Test go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy CodSpeed config file
        run: |
          cat > /tmp/codspeed.yml << 'EOF'
          # CodSpeed configuration
          EOF
      - id: action
        uses: .
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          config: "/tmp/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert action ran with go-runner-version and config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with go-runner-version and config inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/install issue in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
