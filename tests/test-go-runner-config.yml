name: Test go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal codspeed config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codspeed-config"
          cat > "$GITHUB_WORKSPACE/codspeed-config/codspeed.yml" <<'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          config: "${{ github.workspace }}/codspeed-config/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (go-runner-version and config inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with go-runner-version/config inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
