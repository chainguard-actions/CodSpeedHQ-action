name: Test action with all optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory and config file
        run: |
          mkdir -p /tmp/bench-workdir
          cat > /tmp/codspeed.yml <<'EOF'
          benchmarks:
            - name: example
          EOF

      - id: action
        uses: .
        with:
          mode: walltime
          run: "echo 'benchmark placeholder'"
          token: "fake-token-for-coverage"
          upload-url: "https://api.codspeed.io"
          working-directory: "/tmp/bench-workdir"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGO_URI"
          go-runner-version: "1.0.0"
          config: "/tmp/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran with all optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with all optional inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/runner install may not be available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
