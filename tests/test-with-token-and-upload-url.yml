name: Test with token and upload-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept CodSpeed installer download
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CodSpeed action with token and upload-url
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: "walltime"
          token: "test-token-value"
          upload-url: "https://api.example.com/upload"
          allow-empty: "true"
          runner-version: "latest"
          cache-instruments: "false"
          skip-hash-check-warning: "true"

      - name: Assert codspeed binary is installed
        run: |
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after action ran"
            exit 1
          fi
          echo "PASS: codspeed binary is installed at $(which codspeed)"

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME); token and upload-url inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
