name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory and config file
        run: |
          mkdir -p /tmp/codspeed-workdir
          cat > /tmp/codspeed.yml <<'EOF'
          # CodSpeed configuration
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          run: "echo 'no benchmarks'"
          token: "fake-token-for-coverage"
          upload-url: "https://api.codspeed.io"
          working-directory: "/tmp/codspeed-workdir"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGODB_URI"
          config: "/tmp/codspeed.yml"
          go-runner-version: "1.0.0"
          allow-empty: "true"
          skip-hash-check-warning: "true"

      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to network issues or the fake token,
          # but it must not fail due to unrecognized inputs.
          # We accept both success and failure as valid outcomes,
          # but not a skipped step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with extra inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
