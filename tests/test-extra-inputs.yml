name: Test extra inputs coverage (token, upload-url, instruments, mongo-uri-env-name, go-runner-version, config)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake CodSpeed installer and curl
        run: |
          mkdir -p /tmp/fake-bin

          # Write a fake codspeed binary that records its args for assertion
          printf '#!/bin/sh\necho "Fake CodSpeed runner - args: $*"\nprintf "%s\n" "$@" > /tmp/codspeed-args.txt\nexit 0\n' \
            > /tmp/fake-bin/codspeed
          chmod +x /tmp/fake-bin/codspeed

          # Write a fake install script - just echoes success
          printf '#!/bin/sh\necho "Fake CodSpeed installer: nothing to do"\nexit 0\n' \
            > /tmp/fake-codspeed-install.sh
          chmod +x /tmp/fake-codspeed-install.sh

          # Create fake curl that intercepts codspeed.io URLs
          # Supports both pipe form (stdout) and hardened -o FILE form
          printf '#!/bin/sh\nout=""\nprev=""\nfor arg in "$@"; do\n  case "$prev" in\n    -o|--output) out="$arg" ;;\n  esac\n  prev="$arg"\ndone\ncase "$*" in\n  *codspeed.io*)\n    if [ -n "$out" ]; then\n      cat /tmp/fake-codspeed-install.sh > "$out"\n    else\n      cat /tmp/fake-codspeed-install.sh\n    fi\n    exit 0\n    ;;\nesac\nexec /usr/bin/curl "$@"\n' \
            > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          mode: simulation
          run: "echo 'no benchmarks here'"
          runner-version: "latest"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          token: "fake-codspeed-token-for-testing"
          upload-url: "https://example.com/upload"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGO_URI"
          go-runner-version: "1.0.0"
          config: "codspeed.yml"

      - name: Assert token was passed to runner
        run: |
          echo "Checking codspeed args..."
          cat /tmp/codspeed-args.txt || true
          if ! grep -q "fake-codspeed-token-for-testing" /tmp/codspeed-args.txt; then
            echo "FAIL: expected token to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: token was passed"

      - name: Assert upload-url was passed to runner
        run: |
          if ! grep -q "example.com/upload" /tmp/codspeed-args.txt; then
            echo "FAIL: expected upload-url to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: upload-url was passed"

      - name: Assert instruments was passed to runner
        run: |
          if ! grep -q "mongodb" /tmp/codspeed-args.txt; then
            echo "FAIL: expected instruments to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: instruments was passed"

      - name: Assert mongo-uri-env-name was passed to runner
        run: |
          if ! grep -q "MONGO_URI" /tmp/codspeed-args.txt; then
            echo "FAIL: expected mongo-uri-env-name to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: mongo-uri-env-name was passed"

      - name: Assert go-runner-version was passed to runner
        run: |
          if ! grep -q "1.0.0" /tmp/codspeed-args.txt; then
            echo "FAIL: expected go-runner-version to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: go-runner-version was passed"

      - name: Assert config was passed to runner
        run: |
          if ! grep -q "codspeed.yml" /tmp/codspeed-args.txt; then
            echo "FAIL: expected config to be passed to codspeed runner"
            exit 1
          fi
          echo "PASS: config was passed"
