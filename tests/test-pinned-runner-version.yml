name: Test pinned runner version with hash verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: "echo 'benchmark placeholder'"
          runner-version: "5.5.0"
          allow-empty: "true"
      - name: Assert action ran with pinned version and hash verification
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The codspeed runner may fail under act due to missing GitHub Actions context,
          # but the key thing to verify is that the runner was installed with hash verification.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with pinned runner version 5.5.0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act - missing GitHub Actions context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Verify codspeed binary was installed regardless of run outcome
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after installation"
            exit 1
          fi
          echo "PASS: codspeed binary installed successfully with pinned version 5.5.0"
