name: Test pinned release runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODSPEED_SKIP_UPLOAD: "true"
      # Set the mock hash to match what the action expects for version 4.18.4
      # This allows our mock sha256sum to return the expected hash for the installer
      CODSPEED_MOCK_INSTALLER_HASH: "d7c4fbafa5d2651cec48793af1149b63a3484d9f5fa1b3663e710c972550ccf8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock binaries
        run: |
          MOCK_BIN="$GITHUB_WORKSPACE/tests/fixtures/mock-bin"
          chmod +x "$MOCK_BIN/curl" "$MOCK_BIN/codspeed" "$MOCK_BIN/sha256sum"
          echo "$MOCK_BIN" >> "$GITHUB_PATH"

      - name: Run CodSpeed action with pinned runner version 4.18.4
        id: action
        uses: .
        with:
          mode: walltime
          run: echo "Working!"
          runner-version: "4.18.4"
          allow-empty: "true"
          cache-instruments: "false"

      - name: Assert action completed successfully
        run: |
          echo "PASS: CodSpeed action completed with pinned runner version 4.18.4"
