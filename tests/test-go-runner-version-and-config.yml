name: Test go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CodSpeed config file
        run: |
          mkdir -p /tmp/codspeed-config
          cat > /tmp/codspeed-config/codspeed.yml <<'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        with:
          mode: simulation
          go-runner-version: "1.0.0"
          config: "/tmp/codspeed-config/codspeed.yml"
          allow-empty: "true"
        continue-on-error: true
      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
