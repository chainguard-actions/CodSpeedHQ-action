name: Test with go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and codspeed binary
        run: |
          mkdir -p /tmp/fake-bin "$HOME/.local/bin"

          # Write a fake codspeed binary that records its arguments
          printf '%s\n' '#!/bin/sh' \
            'echo "Fake CodSpeed runner args: $*"' \
            'echo "$*" > /tmp/codspeed-args.txt' \
            'case "$1" in' \
            '  run) echo "No benchmarks found."; exit 0 ;;' \
            '  *) echo "Unknown command: $1"; exit 0 ;;' \
            'esac' > "$HOME/.local/bin/codspeed"
          chmod +x "$HOME/.local/bin/codspeed"

          # Write a fake installer
          printf '%s\n' '#!/bin/sh' \
            'echo "Fake CodSpeed installer running"' \
            'echo "CodSpeed runner installed successfully (fake)"' > /tmp/fake-codspeed-install.sh
          chmod +x /tmp/fake-codspeed-install.sh

          # Write a fake curl that intercepts codspeed.io requests
          printf '%s\n' '#!/bin/sh' \
            'out=""' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -o|--output) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *codspeed.io*)' \
            '    if [ -n "$out" ]; then' \
            '      cat /tmp/fake-codspeed-install.sh > "$out"' \
            '    else' \
            '      cat /tmp/fake-codspeed-install.sh' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            '  *)' \
            '    exec /usr/bin/curl "$@"' \
            '    ;;' \
            'esac' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl

          # Create a fake codspeed config file for testing
          echo "version: 1" > /tmp/codspeed.yml

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CodSpeed action with go-runner-version and config
        id: action
        uses: .
        with:
          mode: "walltime"
          runner-version: "latest"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
          go-runner-version: "1.0.0"
          config: "/tmp/codspeed.yml"

      - name: Assert action completed and go-runner-version/config were passed
        run: |
          echo "Checking codspeed runner was called with go-runner-version and config..."
          if [ ! -f /tmp/codspeed-args.txt ]; then
            echo "FAIL: codspeed binary was not called"
            exit 1
          fi
          ARGS=$(cat /tmp/codspeed-args.txt)
          echo "Args: $ARGS"
          if ! echo "$ARGS" | grep -q -- "--go-runner-version"; then
            echo "FAIL: expected --go-runner-version argument to be passed"
            exit 1
          fi
          if ! echo "$ARGS" | grep -q -- "--config"; then
            echo "FAIL: expected --config argument to be passed"
            exit 1
          fi
          echo "PASS: go-runner-version and config were passed to the runner"
