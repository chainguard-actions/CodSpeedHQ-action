name: Test go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CodSpeed config file
        run: |
          cat > "$GITHUB_WORKSPACE/codspeed-test.yml" <<'EOF'
          version: 2
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          config: codspeed-test.yml
          allow-empty: "true"
          skip-hash-check-warning: "true"
          runner-version: latest
      - name: Assert action ran with go-runner-version and config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with go-runner-version and config inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when go-runner version or config not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
