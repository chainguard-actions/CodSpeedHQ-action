name: Test walltime mode with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          mode: walltime
          allow-empty: "true"
          skip-hash-check-warning: "false"
        continue-on-error: true

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with walltime mode and allow-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/install issue in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
