name: Test memory mode options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: memory
          disable-memory-track-physical: "true"
          disable-memory-capture-stack: "true"
          allow-empty: "true"
          runner-version: latest
          skip-hash-check-warning: "true"
      - name: Assert action ran (memory mode options accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with disable-memory-track-physical and disable-memory-capture-stack inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
