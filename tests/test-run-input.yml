name: Test run input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          run: "echo 'benchmark placeholder'"
          mode: simulation
          token: "fake-token-for-testing"
          upload-url: "https://api.codspeed.io"
          working-directory: "."
          allow-empty: "true"
          runner-version: latest
          skip-hash-check-warning: "true"
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token/upload-url)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
