name: Test run input with working-directory and upload-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/bench-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: "echo 'benchmark placeholder'"
          working-directory: /tmp/bench-workdir
          upload-url: "https://api.codspeed.io"
          token: "fake-codspeed-token"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with run/working-directory/upload-url/token inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
