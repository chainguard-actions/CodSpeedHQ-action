name: Test cache-instruments feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with caching enabled (default)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          allow-empty: "true"
          runner-version: "5.4.0"
          cache-instruments: "true"
          instruments-cache-dir: "~/.cache/codspeed-action"
          skip-hash-check-warning: "false"

      - name: Assert action ran with caching enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with caching enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed token/upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Run CodSpeed action with caching disabled
        id: action-no-cache
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          allow-empty: "true"
          runner-version: "5.4.0"
          cache-instruments: "false"
          skip-hash-check-warning: "false"

      - name: Assert action ran with caching disabled
        env:
          OUTCOME: ${{ steps.action-no-cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with caching disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed token/upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
