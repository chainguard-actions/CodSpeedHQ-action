name: Test allow-empty with simulation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with simulation mode and allow-empty
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          allow-empty: "true"
          skip-hash-check-warning: "true"
          run: "echo 'no benchmarks here'"

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With simulation mode and allow-empty=true, the action should:
          # 1. Install the CodSpeed runner
          # 2. Run in simulation mode (requires valgrind/perf)
          # 3. Complete successfully even if no benchmarks are found (allow-empty=true)
          # A failure is acceptable if valgrind/perf is not available in the test environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with simulation mode and allow-empty=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in test environment - valgrind/perf may not be available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
