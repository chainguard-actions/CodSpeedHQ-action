name: Test with cache-instruments disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODSPEED_SKIP_UPLOAD: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock binaries
        run: |
          MOCK_BIN="$GITHUB_WORKSPACE/tests/fixtures/mock-bin"
          chmod +x "$MOCK_BIN/curl" "$MOCK_BIN/codspeed"
          echo "$MOCK_BIN" >> "$GITHUB_PATH"

      - name: Run CodSpeed action with caching disabled
        id: action
        uses: .
        with:
          mode: walltime
          run: echo "Working!"
          allow-empty: "true"
          cache-instruments: "false"
          runner-version: latest
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully
        run: |
          echo "PASS: CodSpeed action completed with cache-instruments=false"
