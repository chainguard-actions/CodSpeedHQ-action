name: Test with caching disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: walltime
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert action step ran
        if: steps.action.outcome == 'skipped' || steps.action.outcome == ''
        run: |
          echo "FAIL: action step was skipped or did not run (outcome=${{ steps.action.outcome }})"
          exit 1
      - name: Report outcome
        run: |
          echo "PASS: action step ran with outcome=${{ steps.action.outcome }} (cache-instruments=false)"
