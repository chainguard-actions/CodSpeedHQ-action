name: Test go-runner-version and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          go-runner-version: "1.0.0"
          config: hardened/tests/fixtures/codspeed.yml
          allow-empty: "true"
          runner-version: latest
          skip-hash-check-warning: "true"
      - name: Assert action ran (go-runner-version and config inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail at the benchmark run step (no benchmarks),
          # but we verify the inputs were accepted by the action framework.
          echo "PASS: go-runner-version and config inputs were accepted"
