name: Test cycle-estimation and exclude-allocations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          allow-empty: "true"
          runner-version: "latest"
          skip-hash-check-warning: "true"
          cache-instruments: "false"
          cycle-estimation: "true"
          exclude-allocations: "true"

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail gracefully in the harness environment.
          # Simulation mode with cycle-estimation and exclude-allocations may require
          # valgrind/perf which may not be available in this environment.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
