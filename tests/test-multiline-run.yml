name: Test multiline run command with quotes is passed intact
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mocked curl, installer and codspeed CLI
        run: |
          mkdir -p "$HOME/mockbin" "$HOME/mock-log" "$HOME/mockdata"
          rm -f "$HOME/mock-log/"*
          cat > "$HOME/mockdata/fake-install.sh" <<'INSTALLER'
          #!/bin/bash
          echo "fake installer args: $*" >> "$HOME/mock-log/installer.log"
          cat > "$HOME/mockbin/codspeed" <<'CLI'
          #!/bin/bash
          # last argument is the run command
          for last in "$@"; do :; done
          printf '%s' "$last" > "$HOME/mock-log/codspeed-run.txt"
          printf '%s\n' "$@" > "$HOME/mock-log/codspeed-args.txt"
          CLI
          chmod +x "$HOME/mockbin/codspeed"
          INSTALLER
          cat > "$HOME/mockbin/curl" <<'CURL'
          #!/bin/sh
          echo "$*" >> "$HOME/mock-log/curl.log"
          out=""; prev=""; wout=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
              -w|--write-out) wout="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed.io*)
              if [ -n "$out" ]; then
                cat "$HOME/mockdata/fake-install.sh" > "$out"
              else
                cat "$HOME/mockdata/fake-install.sh"
              fi
              if [ -n "$wout" ]; then printf '200'; fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL
          chmod +x "$HOME/mockbin/curl"
          echo "$HOME/mockbin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          mode: walltime
          runner-version: latest
          cache-instruments: "false"
          run: |
            echo "first line with \"quotes\""
            echo 'second line'
      - name: Assert run command preserved
        run: |
          echo "--- codspeed args"; cat "$HOME/mock-log/codspeed-args.txt" || exit 1
          ACTUAL="$(cat "$HOME/mock-log/codspeed-run.txt")"
          EXPECTED="$(printf '%s\n%s' 'echo "first line with \"quotes\""' "echo 'second line'")"
          echo "actual:"; echo "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected:"; echo "$EXPECTED"; exit 1
          fi
          if ! grep -qFx -- '--mode=walltime' "$HOME/mock-log/codspeed-args.txt"; then
            echo "FAIL: --mode=walltime missing"; exit 1
          fi
          echo "PASS"
