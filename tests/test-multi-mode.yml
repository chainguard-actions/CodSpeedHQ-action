name: Test multi-mode (comma-separated modes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test comma-separated modes which triggers mode-cache-key normalization
      # (commas are replaced with dashes in the cache key)
      - id: action
        uses: .
        with:
          mode: "simulation,walltime"
          allow-empty: "true"
          skip-hash-check-warning: "false"
        continue-on-error: true

      - name: Assert action ran (multi-mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multi-mode (simulation,walltime)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/runner install may not be available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
