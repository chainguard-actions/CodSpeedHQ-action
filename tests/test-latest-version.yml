name: Test latest runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: walltime
          runner-version: "latest"
          skip-hash-check-warning: "true"
          allow-empty: "true"
          cache-instruments: "false"
        continue-on-error: true
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with latest runner version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (runner install or execution issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
