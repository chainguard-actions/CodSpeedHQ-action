name: Test simulation mode advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          cycle-estimation: "true"
          exclude-allocations: "true"
          simulation-track-subprocess: "true"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without CodSpeed runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
