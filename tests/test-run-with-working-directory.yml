name: Test run with working-directory and token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/bench-workdir
      - id: action
        uses: .
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          working-directory: /tmp/bench-workdir
          token: "dummy-token-for-coverage"
          allow-empty: "true"
        continue-on-error: true
      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
