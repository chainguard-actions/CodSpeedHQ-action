name: Test missing mode input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: ""
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert action failed due to missing mode
        if: steps.action.outcome != 'failure'
        run: |
          echo "FAIL: expected action to fail when mode is empty, but got outcome=${{ steps.action.outcome }}"
          exit 1
      - name: Report pass
        if: steps.action.outcome == 'failure'
        run: |
          echo "PASS: action correctly failed when mode input is missing (outcome=failure)"
