name: Test missing mode input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODSPEED_SKIP_UPLOAD: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock binaries
        run: |
          MOCK_BIN="$GITHUB_WORKSPACE/tests/fixtures/mock-bin"
          chmod +x "$MOCK_BIN/curl" "$MOCK_BIN/codspeed"
          echo "$MOCK_BIN" >> "$GITHUB_PATH"

      - name: Run CodSpeed action without mode (should fail)
        id: action
        uses: .
        with:
          allow-empty: "true"
          runner-version: latest
          skip-hash-check-warning: "true"
          cache-instruments: "false"
        continue-on-error: true

      - name: Assert action failed due to missing mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when mode is not provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when mode input was missing"
