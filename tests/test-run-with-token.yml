name: Test run and token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          token: "fake-codspeed-token"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (run and token inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run and token inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real CodSpeed token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
