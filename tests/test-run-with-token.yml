name: Test run input with token and upload-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/bench-workdir
      - id: action
        uses: .
        with:
          mode: walltime
          run: "echo 'benchmark placeholder'"
          token: "fake-codspeed-token"
          upload-url: "https://api.codspeed.io/upload"
          working-directory: "/tmp/bench-workdir"
          allow-empty: "true"
          runner-version: "5.2.1"
          skip-hash-check-warning: "false"
          cache-instruments: "false"
        continue-on-error: true
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (runner install or execution issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
