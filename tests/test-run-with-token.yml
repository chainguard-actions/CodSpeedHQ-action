name: Test run input with token, upload-url, and working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with run, token, upload-url, and working-directory inputs
        id: action
        uses: .
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          token: "fake-codspeed-token"
          upload-url: "https://api.codspeed.io"
          working-directory: "."
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran (run/token/upload-url/working-directory inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with run/token/upload-url/working-directory inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real CodSpeed token or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
