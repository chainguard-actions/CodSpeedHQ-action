name: Test pinned runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with a specific pinned version (with v prefix to test stripping)
      - id: action
        uses: .
        with:
          mode: walltime
          runner-version: "v4.15.0"
          run: echo "benchmark placeholder"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with pinned version v4.15.0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/install issue acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
