name: Test CodSpeed action with pinned runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with pinned runner version 5.2.0
        id: action
        uses: .
        with:
          mode: walltime
          runner-version: "5.2.0"
          allow-empty: "true"
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pinned runner version 5.2.0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (upload may fail in harness without valid token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
