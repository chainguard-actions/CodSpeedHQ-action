name: Test that missing benchmarks fail when allow-empty is false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          allow-empty: "false"
          skip-hash-check-warning: "true"
      - name: Assert action failed when no benchmarks found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no benchmarks were found and allow-empty=false"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail when no benchmarks found and allow-empty=false"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
