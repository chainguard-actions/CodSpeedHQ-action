name: Test run, token, and upload-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: "echo 'benchmark placeholder'"
          mode: simulation
          token: "dummy-token-for-coverage"
          upload-url: "https://api.codspeed.io"
          runner-version: latest
          skip-hash-check-warning: "true"
          allow-empty: "true"
        continue-on-error: true
      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real benchmarks)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
