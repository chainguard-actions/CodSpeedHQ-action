name: Test instruments and mongo-uri-env-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          instruments: mongodb
          mongo-uri-env-name: MONGODB_URI
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real MongoDB/CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
