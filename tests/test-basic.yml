name: Test basic usage with core inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          token: "fake-token-for-test"
          working-directory: "."
          upload-url: "https://api.codspeed.io"
          runner-version: "latest"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert action ran (allow-empty permits no benchmarks)
        run: |
          echo "Action completed (continue-on-error allows network/install failures in test env)"
          echo "PASS"
