name: Test advanced inputs (go-runner-version, cycle-estimation, exclude-allocations, simulation-track-subprocess, config)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal codspeed config file
        run: |
          cat > /tmp/codspeed.yml <<'EOF'
          benchmarks:
            - name: example
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          go-runner-version: "1.0.0"
          cycle-estimation: "true"
          exclude-allocations: "false"
          simulation-track-subprocess: "true"
          config: "/tmp/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (install or run may fail in test env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (install/run may fail in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
