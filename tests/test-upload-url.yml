name: Test upload-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to mock CodSpeed installer
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - name: Run CodSpeed action with upload-url input
        id: action
        uses: .
        with:
          mode: "walltime"
          upload-url: "https://example.com/upload"
          runner-version: "latest"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully with upload-url input
        run: |
          echo "PASS: CodSpeed action completed with upload-url=https://example.com/upload"
