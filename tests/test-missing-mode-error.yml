name: Test missing mode input error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action without required mode input
        id: action
        uses: .
        continue-on-error: true
        with:
          run: "echo 'no mode set'"
          allow-empty: "true"

      - name: Assert action failed due to missing mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when mode input is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when mode is not provided"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
