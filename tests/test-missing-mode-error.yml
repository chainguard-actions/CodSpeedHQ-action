name: Test error when mode input is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires 'mode' input. When it's not provided (empty string workaround),
      # the action should fail with a specific error about missing mode.
      # Note: Since 'mode' is required: true in action.yml, we test with an explicit empty
      # value to simulate the missing mode scenario and verify the error handling.
      - id: action
        uses: .
        with:
          mode: ""
          allow-empty: "true"
        continue-on-error: true

      - name: Assert action failed due to missing mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when mode is empty/missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when mode is empty"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
