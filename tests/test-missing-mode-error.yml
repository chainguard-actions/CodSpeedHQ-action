name: Test error when mode input is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires 'mode' input. When it's missing (empty string workaround),
      # the action should emit an error and exit 1 in the "Run the benchmarks" step.
      # Note: since 'mode' is marked required: true in action.yml, we pass an empty
      # string to bypass the YAML required check and test the runtime validation.
      - id: action
        uses: .
        with:
          mode: ""
          allow-empty: "true"
        continue-on-error: true

      - name: Assert action failed due to missing mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when mode input is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when mode is empty"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
