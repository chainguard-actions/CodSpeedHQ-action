name: Test token and upload-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with token and upload-url inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          allow-empty: "true"
          skip-hash-check-warning: "true"
          token: "fake-codspeed-token-for-testing"
          upload-url: "https://api.codspeed.io"
          run: "echo 'no benchmarks here'"

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should install the CodSpeed runner and attempt to run.
          # With a fake token, upload may fail, but the action should still
          # complete (success or graceful failure) — not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with token and upload-url inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable - fake token or env limitations)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
