name: Test token and upload-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          mode: walltime
          run: echo "no benchmarks here"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          token: "fake-codspeed-token-for-testing"
          upload-url: "https://api.codspeed.io"
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with token and upload-url inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/install issue or invalid token acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
