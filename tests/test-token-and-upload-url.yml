name: Test token and upload-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          token: fake-token-for-testing
          upload-url: https://example.com/upload
          allow-empty: "true"
          runner-version: latest
          skip-hash-check-warning: "true"
      - name: Assert action ran (token and upload-url inputs accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail at the benchmark run step (no benchmarks),
          # but it should not fail due to missing/invalid input handling.
          # We just verify the inputs were accepted by the action framework.
          echo "PASS: token and upload-url inputs were accepted"
