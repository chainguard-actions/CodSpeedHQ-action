name: Test CodSpeed runner installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          mode: walltime
          allow-empty: "true"
          runner-version: "5.4.2"
          cache-instruments: "false"
          skip-hash-check-warning: "false"
        continue-on-error: true

      - name: Assert codspeed binary was installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Check if codspeed binary was installed regardless of run outcome
          if command -v codspeed >/dev/null 2>&1; then
            echo "PASS: codspeed binary is installed"
            codspeed --version || true
          else
            # The binary might be in a non-standard location
            if [ -f "$HOME/.local/bin/codspeed" ] || [ -f "/usr/local/bin/codspeed" ]; then
              echo "PASS: codspeed binary found in expected location"
            else
              echo "INFO: codspeed binary not found in PATH or standard locations"
              echo "outcome was: $OUTCOME"
              if [ "$OUTCOME" = "failure" ]; then
                echo "PASS: action failed gracefully (install may have failed in harness environment)"
              else
                echo "FAIL: action succeeded but codspeed binary not found"
                exit 1
              fi
            fi
          fi
