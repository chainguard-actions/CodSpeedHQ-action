name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run CodSpeed action with go-runner-version
        uses: .
        with:
          mode: simulation
          go-runner-version: "1.0.0"
          allow-empty: "true"
          skip-hash-check-warning: "true"
