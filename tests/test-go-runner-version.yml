name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran (go-runner-version input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with go-runner-version input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/runner install may not be available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
