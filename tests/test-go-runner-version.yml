name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and codspeed binary
        run: |
          mkdir -p /tmp/fake-bin "$HOME/.local/bin"

          # Write a fake codspeed binary that captures args to a file
          cat > "$HOME/.local/bin/codspeed" << 'CODSPEED_EOF'
          #!/bin/sh
          echo "Fake CodSpeed runner args: $*"
          echo "$*" > /tmp/codspeed-args.txt
          case "$1" in
            run) echo "No benchmarks found."; exit 0 ;;
            *) echo "Unknown command: $1"; exit 0 ;;
          esac
          CODSPEED_EOF
          chmod +x "$HOME/.local/bin/codspeed"

          # Write a fake installer
          cat > /tmp/fake-codspeed-install.sh << 'INSTALL_EOF'
          #!/bin/sh
          echo "Fake CodSpeed installer running"
          echo "CodSpeed runner installed successfully (fake)"
          INSTALL_EOF
          chmod +x /tmp/fake-codspeed-install.sh

          # Write a fake curl that intercepts codspeed.io requests and honors -o flag
          cat > /tmp/fake-bin/curl << 'CURL_EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed.io*)
              if [ -n "$out" ]; then
                cat /tmp/fake-codspeed-install.sh > "$out"
              else
                cat /tmp/fake-codspeed-install.sh
              fi
              exit 0
              ;;
            *)
              exec /usr/bin/curl "$@"
              ;;
          esac
          CURL_EOF
          chmod +x /tmp/fake-bin/curl

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CodSpeed action with go-runner-version
        id: action
        uses: .
        with:
          mode: "walltime"
          runner-version: "latest"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
          go-runner-version: "1.0.0"

      - name: Assert go-runner-version was passed to runner
        run: |
          echo "Captured args:"
          cat /tmp/codspeed-args.txt || echo "(no args file)"
          ARGS=$(cat /tmp/codspeed-args.txt 2>/dev/null || echo "")
          echo "args: $ARGS"
          if echo "$ARGS" | grep -q -- "--go-runner-version"; then
            echo "PASS: --go-runner-version argument was passed"
          else
            echo "FAIL: --go-runner-version argument was not passed to codspeed runner"
            exit 1
          fi
          echo "PASS: go-runner-version input correctly forwarded to runner"
