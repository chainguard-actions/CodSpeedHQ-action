name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran with go-runner-version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the runner install fails or benchmarks fail,
          # but it must not fail due to missing required inputs.
          # We accept success or failure (network/runner issues), but not skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with go-runner-version input (outcome: $OUTCOME)"
