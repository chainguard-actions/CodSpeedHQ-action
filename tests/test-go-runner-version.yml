name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: walltime
          go-runner-version: "1.0.0"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          runner-version: latest
      - name: Assert action completed
        run: |
          echo "PASS: action completed with go-runner-version input"
