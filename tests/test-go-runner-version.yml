name: Test go-runner-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with go-runner-version input
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          allow-empty: "true"
          skip-hash-check-warning: "true"
          go-runner-version: "1.0.0"
          run: "echo 'no benchmarks here'"

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should install the CodSpeed runner and pass the go-runner-version
          # argument. Success or graceful failure is acceptable in the test environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with go-runner-version input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
