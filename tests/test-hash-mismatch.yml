name: Test release version with tampered installer fails hash verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mocked curl serving a tampered installer
        run: |
          mkdir -p "$HOME/mockbin" "$HOME/mock-log" "$HOME/mockdata"
          rm -f "$HOME/mock-log/"*
          cat > "$HOME/mockdata/fake-install.sh" <<'INSTALLER'
          #!/bin/bash
          echo "TAMPERED installer executed" >> "$HOME/mock-log/installer.log"
          cat > "$HOME/mockbin/codspeed" <<'CLI'
          #!/bin/bash
          printf '%s\n' "$@" > "$HOME/mock-log/codspeed-args.txt"
          CLI
          chmod +x "$HOME/mockbin/codspeed"
          INSTALLER
          cat > "$HOME/mockbin/curl" <<'CURL'
          #!/bin/sh
          echo "$*" >> "$HOME/mock-log/curl.log"
          out=""; prev=""; wout=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
              -w|--write-out) wout="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed.io*)
              if [ -n "$out" ]; then
                cat "$HOME/mockdata/fake-install.sh" > "$out"
              else
                cat "$HOME/mockdata/fake-install.sh"
              fi
              if [ -n "$wout" ]; then printf '200'; fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL
          chmod +x "$HOME/mockbin/curl"
          echo "$HOME/mockbin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          cache-instruments: "false"
          run: echo hello
      - name: Assert action failed and tampered installer was never executed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- curl log"; cat "$HOME/mock-log/curl.log" || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to installer hash mismatch"; exit 1
          fi
          if [ -f "$HOME/mock-log/installer.log" ]; then
            echo "FAIL: tampered installer was executed"; exit 1
          fi
          if [ -f "$HOME/mock-log/codspeed-args.txt" ]; then
            echo "FAIL: codspeed should not have been invoked"; exit 1
          fi
          echo "PASS"
