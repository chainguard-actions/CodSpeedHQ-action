name: Test instruments, token, upload-url, and mongo-uri-env-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with instruments, token, upload-url, and mongo-uri-env-name
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: "echo 'no benchmarks here'"
          allow-empty: "true"
          token: "fake-codspeed-token"
          upload-url: "https://api.codspeed.io"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGODB_URI"
          skip-hash-check-warning: "false"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
