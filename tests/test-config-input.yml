name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CodSpeed config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codspeed-config"
          cat > "$GITHUB_WORKSPACE/codspeed-config/codspeed.yml" <<'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: "walltime"
          config: "${{ github.workspace }}/codspeed-config/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          runner-version: "latest"
      - name: Assert action ran (config input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
