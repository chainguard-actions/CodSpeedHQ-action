name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run CodSpeed action with config file
        uses: .
        with:
          mode: simulation
          config: ${{ github.workspace }}/hardened/tests/fixtures/codspeed.yml
          allow-empty: "true"
          skip-hash-check-warning: "true"
