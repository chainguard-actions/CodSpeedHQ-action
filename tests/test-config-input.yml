name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a CodSpeed config file
        run: |
          cat > "$GITHUB_WORKSPACE/codspeed.yml" <<'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        with:
          mode: simulation
          config: codspeed.yml
          allow-empty: "true"
        continue-on-error: true
      - name: Assert action ran (config input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with config input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
