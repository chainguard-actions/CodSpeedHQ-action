name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a CodSpeed config file
        run: |
          cat > /tmp/codspeed.yml << 'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        with:
          mode: simulation
          allow-empty: "true"
          config: "/tmp/codspeed.yml"
          skip-hash-check-warning: "true"
          runner-version: "latest"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with config input"
