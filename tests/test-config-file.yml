name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a CodSpeed config file
        run: |
          cat > /tmp/codspeed.yml << 'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          config: "/tmp/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
