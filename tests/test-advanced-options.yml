name: Test advanced options - go-runner-version, cycle-estimation, exclude-allocations, config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal codspeed config file
        run: |
          cat > /tmp/codspeed.yml <<'EOF'
          version: 1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          go-runner-version: "1.0.0"
          cycle-estimation: "true"
          exclude-allocations: "true"
          config: "/tmp/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (install or run may fail in test env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without real CodSpeed runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
