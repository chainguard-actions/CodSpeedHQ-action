name: Test simulation mode with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install valgrind for simulation mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          runner-version: "latest"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
      - name: Assert codspeed binary is installed
        run: |
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after action ran"
            exit 1
          fi
          echo "PASS: codspeed binary is installed at $(which codspeed)"
      - name: Assert action outcome for simulation mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in simulation mode"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME), but binary was installed"
            echo "PASS: binary installation verified for simulation mode"
          fi
