name: Test CodSpeed simulation mode with core inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: "echo 'benchmark placeholder'"
          mode: "simulation"
          token: "test-token-placeholder"
          working-directory: "."
          upload-url: "https://api.codspeed.io"
          runner-version: "latest"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"
