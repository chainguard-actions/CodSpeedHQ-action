name: Test simulation mode with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test CodSpeed action in simulation mode
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: "simulation"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          runner-version: "latest"
      - name: Assert CodSpeed runner was installed
        run: |
          echo "Checking if codspeed runner binary is available..."
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found in PATH"
            exit 1
          fi
          echo "codspeed binary found at: $(which codspeed)"
          echo "PASS"
