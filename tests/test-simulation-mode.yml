name: Test CodSpeed action with simulation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with simulation mode
        id: action
        uses: .
        with:
          mode: simulation
          allow-empty: "true"
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with simulation mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (simulation may require valgrind or upload may fail in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
