name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory with a test script
        run: |
          mkdir -p /tmp/bench-workdir
          echo '#!/bin/bash' > /tmp/bench-workdir/run_bench.sh
          echo 'echo "Running benchmark in working directory"' >> /tmp/bench-workdir/run_bench.sh
          chmod +x /tmp/bench-workdir/run_bench.sh

      - id: action
        uses: .
        with:
          mode: walltime
          working-directory: /tmp/bench-workdir
          run: bash run_bench.sh
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with working-directory set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/install issue acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
