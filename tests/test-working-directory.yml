name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake codspeed binary and mock curl
        run: |
          # Create a fake codspeed binary that exits 0
          sudo tee /usr/local/bin/codspeed > /dev/null << 'EOF'
          #!/bin/sh
          echo "fake codspeed called with: $*"
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/codspeed

          # Create a fake installer script
          sudo tee /tmp/fake-codspeed-install.sh > /dev/null << 'EOF'
          #!/bin/sh
          echo "fake installer: codspeed already installed"
          exit 0
          EOF
          sudo chmod +x /tmp/fake-codspeed-install.sh

          # Create a fake curl that serves the fake installer
          sudo tee /usr/local/bin/curl > /dev/null << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed*|*install*)
              if [ -n "$out" ]; then
                cat /tmp/fake-codspeed-install.sh > "$out"
              else
                cat /tmp/fake-codspeed-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          sudo chmod +x /usr/local/bin/curl

          # Create the working directory
          mkdir -p /tmp/bench-workdir
          echo "echo 'benchmark placeholder'" > /tmp/bench-workdir/run_bench.sh
          chmod +x /tmp/bench-workdir/run_bench.sh

      - id: action
        uses: .
        with:
          mode: walltime
          working-directory: "/tmp/bench-workdir"
          run: "echo 'no benchmarks here'"
          allow-empty: "true"
          runner-version: "latest"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully with working-directory
        run: |
          echo "Action completed successfully with working-directory set and allow-empty=true"
          echo "PASS"
