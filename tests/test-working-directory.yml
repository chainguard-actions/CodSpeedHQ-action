name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept CodSpeed installer download
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Create the working directory for the test
          mkdir -p /tmp/codspeed-test-workdir

      - name: Run CodSpeed action with working-directory
        id: action
        uses: .
        with:
          mode: "walltime"
          allow-empty: "true"
          runner-version: "latest"
          cache-instruments: "false"
          working-directory: "/tmp/codspeed-test-workdir"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully with working-directory
        run: |
          echo "Action completed successfully with working-directory set"
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after installation"
            exit 1
          fi
          echo "PASS: codspeed binary found at $(command -v codspeed)"
