name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and codspeed installer
        run: |
          # Create a fake install script that installs a fake codspeed binary
          cat > /tmp/fake-codspeed-install.sh << 'INSTALL_EOF'
          #!/bin/sh
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\necho "Fake codspeed called with args: $@"\nexit 0\n' > /usr/local/bin/codspeed
          chmod +x /usr/local/bin/codspeed
          INSTALL_EOF
          chmod +x /tmp/fake-codspeed-install.sh

          # Create a fake curl that intercepts codspeed.io URLs
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'CURL_EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed.io*)
              if [ -n "$out" ]; then
                cat /tmp/fake-codspeed-install.sh > "$out"
              else
                cat /tmp/fake-codspeed-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL_EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - name: Create a working directory with a marker file
        run: |
          mkdir -p /tmp/bench-workdir
          echo "marker" > /tmp/bench-workdir/marker.txt

      - name: Run CodSpeed action with working-directory
        id: action
        uses: .
        with:
          mode: walltime
          runner-version: latest
          working-directory: /tmp/bench-workdir
          run: "cat marker.txt"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully
        run: |
          echo "PASS: CodSpeed action completed with working-directory set"
