name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory for the test
        run: mkdir -p /tmp/bench-workdir

      - name: Run CodSpeed action with working-directory set
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: "echo 'running in working dir'"
          working-directory: "/tmp/bench-workdir"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "false"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with working-directory set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed token/repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
