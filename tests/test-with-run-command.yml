name: Test with run command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the 'run' input is passed through to the codspeed runner.
      # Using allow-empty so the action doesn't fail if no benchmarks are found.
      - id: action
        uses: .
        with:
          mode: walltime
          run: "echo 'no benchmarks here'"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "false"
        continue-on-error: true

      - name: Assert action ran with run command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with run command and allow-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
