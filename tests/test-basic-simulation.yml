name: Test basic simulation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          token: "fake-token-for-testing"
          upload-url: "https://api.codspeed.io"
          working-directory: "."
          runner-version: "latest"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to no real benchmarks, which is expected)"
          echo "PASS"
