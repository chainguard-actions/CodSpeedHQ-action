name: Test instruments and mongo-uri-env-name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake codspeed binary and mock curl
        run: |
          # Create a fake codspeed binary that records its arguments
          sudo tee /usr/local/bin/codspeed > /dev/null << 'EOF'
          #!/bin/sh
          echo "fake codspeed called with: $*"
          echo "$*" > /tmp/codspeed-args.txt
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/codspeed

          # Create a fake installer script
          sudo tee /tmp/fake-codspeed-install.sh > /dev/null << 'EOF'
          #!/bin/sh
          echo "fake installer: codspeed already installed"
          exit 0
          EOF
          sudo chmod +x /tmp/fake-codspeed-install.sh

          # Create a fake curl that serves the fake installer
          sudo tee /usr/local/bin/curl > /dev/null << 'CURLEOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *codspeed*|*install*)
              if [ -n "$out" ]; then
                cat /tmp/fake-codspeed-install.sh > "$out"
              else
                cat /tmp/fake-codspeed-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURLEOF
          sudo chmod +x /usr/local/bin/curl

      - id: action
        uses: .
        with:
          mode: simulation
          instruments: "mongodb"
          mongo-uri-env-name: "MONGODB_URI"
          run: "echo 'no benchmarks here'"
          allow-empty: "true"
          runner-version: "latest"
          skip-hash-check-warning: "true"

      - name: Assert action completed with instruments and mongo-uri-env-name
        run: |
          echo "Checking codspeed was called with instruments and mongo-uri-env-name args..."
          if [ -f /tmp/codspeed-args.txt ]; then
            ARGS=$(cat /tmp/codspeed-args.txt)
            echo "codspeed args: $ARGS"
            if echo "$ARGS" | grep -q "mongodb"; then
              echo "PASS: instruments=mongodb was passed to codspeed"
            else
              echo "FAIL: instruments=mongodb was not passed to codspeed"
              exit 1
            fi
            if echo "$ARGS" | grep -q "MONGODB_URI"; then
              echo "PASS: mongo-uri-env-name was passed to codspeed"
            else
              echo "FAIL: mongo-uri-env-name was not passed to codspeed"
              exit 1
            fi
          else
            echo "FAIL: codspeed was not called"
            exit 1
          fi
