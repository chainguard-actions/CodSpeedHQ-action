name: Test instruments and upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/bench-workdir
      - id: action
        uses: .
        with:
          mode: walltime
          run: "echo 'no benchmarks'"
          token: "fake-token-for-testing"
          upload-url: "https://example.invalid/upload"
          working-directory: "/tmp/bench-workdir"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGO_URI"
          allow-empty: "true"
          runner-version: "latest"
          skip-hash-check-warning: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with instruments inputs"
