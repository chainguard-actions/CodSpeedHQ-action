name: Test unknown runner version fails installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: echo hello
          runner-version: v99.99.99
          cache-instruments: "false"
      - name: Assert action failed (no installer / no pinned hash for unknown version)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unknown runner version"
            exit 1
          fi
          echo "PASS"
