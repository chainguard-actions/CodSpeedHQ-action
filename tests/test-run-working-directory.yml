name: Test run and working-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with a dummy script
        run: |
          mkdir -p /tmp/bench-workdir
          echo '#!/bin/bash' > /tmp/bench-workdir/run-bench.sh
          echo 'echo "benchmark run"' >> /tmp/bench-workdir/run-bench.sh
          chmod +x /tmp/bench-workdir/run-bench.sh
      - id: action
        uses: .
        with:
          mode: simulation
          run: echo "hello from run input"
          working-directory: /tmp/bench-workdir
          allow-empty: "true"
        continue-on-error: true
      - name: Assert action ran (allow-empty should let it succeed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run and working-directory inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
