name: Test config and go-runner-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to mock CodSpeed installer
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - name: Create a minimal CodSpeed config file
        run: |
          cat > /tmp/codspeed.yml << 'EOF'
          version: 1
          EOF

      - name: Run CodSpeed action with config and go-runner-version inputs
        id: action
        uses: .
        with:
          mode: "walltime"
          config: "/tmp/codspeed.yml"
          go-runner-version: "1.0.0"
          runner-version: "latest"
          allow-empty: "true"
          cache-instruments: "false"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully
        run: |
          echo "PASS: CodSpeed action completed with config and go-runner-version inputs"
