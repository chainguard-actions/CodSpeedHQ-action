name: Test config and go-runner-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with config and go-runner-version inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          run: "echo 'no benchmarks here'"
          allow-empty: "true"
          config: "codspeed.yml"
          go-runner-version: "1.0.0"
          skip-hash-check-warning: "false"

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
