name: Test config and go-runner-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl to intercept CodSpeed installer download
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Create a minimal CodSpeed config file for testing
          mkdir -p /tmp/codspeed-config-test
          cat > /tmp/codspeed-config-test/codspeed.yml <<'EOF'
# Minimal CodSpeed configuration for testing
EOF

      - name: Run CodSpeed action with config and go-runner-version
        id: action
        uses: .
        with:
          mode: "walltime"
          config: "/tmp/codspeed-config-test/codspeed.yml"
          go-runner-version: "1.0.0"
          allow-empty: "true"
          runner-version: "latest"
          cache-instruments: "false"
          skip-hash-check-warning: "true"

      - name: Assert action completed successfully with config and go-runner-version inputs
        run: |
          echo "Action completed successfully with config and go-runner-version inputs"
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after installation"
            exit 1
          fi
          echo "PASS: codspeed binary found at $(command -v codspeed)"
