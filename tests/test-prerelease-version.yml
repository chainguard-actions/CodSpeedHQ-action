name: Test prerelease runner version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with prerelease runner version
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          allow-empty: "true"
          runner-version: "4.3.0-beta.0"
          skip-hash-check-warning: "true"
          run: "echo 'no benchmarks here'"

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a prerelease version (4.3.0-beta.0), the action should:
          # 1. Detect version type as "prerelease" (matches ^[0-9]+\.[0-9]+\.[0-9]+-pattern)
          # 2. Skip hash verification (no pinned hash for prereleases)
          # 3. Download from versioned installer URL
          # 4. Run with allow-empty=true
          # A failure is acceptable if the runner binary fails in the test environment.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with prerelease version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
