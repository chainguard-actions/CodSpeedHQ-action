name: Test memory mode options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: memory
          run: echo hello-memory
          disable-memory-track-physical: "true"
          disable-memory-capture-stack: "true"
          allow-empty: "true"
          cache-instruments: "false"
      - name: Assert runner was installed and step completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          BIN="$(command -v codspeed || true)"
          for p in "$HOME/.cargo/bin/codspeed" "$HOME/.local/bin/codspeed" "/usr/local/bin/codspeed"; do
            if [ -z "$BIN" ] && [ -x "$p" ]; then BIN="$p"; fi
          done
          echo "codspeed binary: $BIN"
          if [ -z "$BIN" ]; then
            echo "FAIL: codspeed runner was not installed"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runner installed; memory run/upload failed gracefully under the harness"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
