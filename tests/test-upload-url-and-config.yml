name: Test upload-url and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy CodSpeed config file
        run: |
          mkdir -p /tmp/codspeed-config
          cat > /tmp/codspeed-config/codspeed.yml <<'EOF'
          # CodSpeed configuration
          EOF

      - id: action
        uses: .
        with:
          mode: walltime
          upload-url: "https://api.example.com/upload"
          config: "/tmp/codspeed-config/codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
        continue-on-error: true

      - name: Assert action ran (upload-url and config inputs covered)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload-url and config inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/runner install may not be available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
