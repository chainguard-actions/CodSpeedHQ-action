name: Test CodSpeed instruments and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mode: "walltime"
          instruments: "mongodb"
          mongo-uri-env-name: "MONGODB_URI"
          go-runner-version: "1.0.0"
          config: "codspeed.yml"
          allow-empty: "true"
          skip-hash-check-warning: "true"
          runner-version: "latest"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with instruments and config inputs"
          echo "PASS"
