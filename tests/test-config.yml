name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CodSpeed config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codspeed-config"
          cat > "$GITHUB_WORKSPACE/codspeed-config/codspeed.yml" <<'EOF'
          # Minimal CodSpeed configuration for testing
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          config: "${{ github.workspace }}/codspeed-config/codspeed.yml"
          allow-empty: "true"
          runner-version: "latest"
          skip-hash-check-warning: "true"
      - name: Assert action ran with config input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on config validity.
          # Either way, the config input was accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
