name: Test simulation mode with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action in simulation mode with allow-empty
        id: action
        uses: .
        with:
          mode: simulation
          allow-empty: "true"
          skip-hash-check-warning: "false"
        continue-on-error: true

      - name: Assert action ran (simulation mode with allow-empty)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in simulation mode with allow-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real benchmarks or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
