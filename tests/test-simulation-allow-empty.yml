name: Test simulation mode with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran in simulation mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The codspeed runner may fail under act due to missing GitHub Actions context
          # (provider.rs panics on unwrap of None for GITHUB_RUN_ID etc.).
          # We accept both success and failure as long as it's not skipped.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in simulation mode with allow-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act - missing GitHub Actions context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Verify codspeed binary was installed
          if ! command -v codspeed &>/dev/null; then
            echo "FAIL: codspeed binary not found after installation"
            exit 1
          fi
          echo "PASS: codspeed binary installed and simulation mode was invoked"
