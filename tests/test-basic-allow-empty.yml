name: Test basic usage with allow-empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodSpeed action with allow-empty (walltime mode)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: walltime
          allow-empty: "true"
          skip-hash-check-warning: "false"

      - name: Assert action ran (installed runner, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with allow-empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid CodSpeed token/upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert codspeed runner was installed
        run: |
          if command -v codspeed >/dev/null 2>&1; then
            echo "PASS: codspeed runner is installed"
            codspeed --version || true
          else
            echo "INFO: codspeed not found in PATH (may be installed elsewhere)"
            # Check common install locations
            if [ -f "$HOME/.local/bin/codspeed" ] || [ -f "/usr/local/bin/codspeed" ]; then
              echo "PASS: codspeed found in alternate location"
            else
              echo "WARN: codspeed runner not found - installation may have failed"
            fi
          fi
