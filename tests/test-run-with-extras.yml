name: Test run with token, upload-url, and working-directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/bench-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: simulation
          run: "echo 'benchmark placeholder'"
          token: "fake-codspeed-token"
          upload-url: "https://api.codspeed.io"
          working-directory: "/tmp/bench-workdir"
          allow-empty: "true"
          skip-hash-check-warning: "true"
      - name: Assert action ran (simulation with run/token/upload-url/working-directory)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run/token/upload-url/working-directory inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real CodSpeed setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
